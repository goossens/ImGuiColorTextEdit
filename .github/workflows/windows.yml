name: Windows

on:
  push:
    branches:
      - master

jobs:
  verify-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Configure
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 -S example

    - name: Build
      run: cmake --build build --config Release
